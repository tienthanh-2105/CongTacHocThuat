<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="440" height="270" fill="url(#cyberBg)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.6">
    <line x1="0" y1="40" x2="440" y2="40" />
    <line x1="0" y1="90" x2="440" y2="90" />
    <line x1="0" y1="140" x2="440" y2="140" />
    <line x1="0" y1="190" x2="440" y2="190" />
    <line x1="80" y1="0" x2="80" y2="270" />
    <line x1="180" y1="0" x2="180" y2="270" />
    <line x1="280" y1="0" x2="280" y2="270" />
    <line x1="380" y1="0" x2="380" y2="270" />
  </g>

  <!-- Left: Award Badge TOP 2 -->
  <rect x="25" y="45" width="105" height="110" rx="10" fill="#18181b" stroke="url(#neonYellow)" stroke-width="2.5" />
  <text x="77" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
    AREA 303
  </text>
  <text x="77" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#neonYellow)" text-anchor="middle">
    TOP 2
  </text>
  <text x="77" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    GIẢI NHÌ
  </text>

  <!-- Right: Competition & Team Info -->
  <text x="150" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#f59e0b" letter-spacing="1">
    CUỘC THI AN TOÀN THÔNG TIN & ĐẤU TRÍ HỌC THUẬT
  </text>
  <text x="150" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="0.5">
    THE BUFFALO PLAYGROUND 2026
  </text>

  <rect x="150" y="110" width="265" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="165" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
    ĐỘI THI ĐẠI DIỆN HUIT:
  </text>
  <text x="165" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#38bdf8" letter-spacing="0.5">
    MAVERICKS · KHOA CÔNG NGHỆ THÔNG TIN
  </text>

  <!-- Stage Platform & Student Figures on Stage -->
  <rect x="0" y="215" width="440" height="55" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <line x1="0" y1="215" x2="440" y2="215" stroke="#facc15" stroke-width="2" />

  <!-- 3 Students holding certificates -->
  <!-- Student 1 -->
  <circle cx="170" cy="180" r="7" fill="#fed7aa" />
  <rect x="162" y="190" width="16" height="25" rx="3" fill="#3b82f6" />
  <rect x="160" y="196" width="12" height="15" rx="1" fill="#f8fafc" stroke="#facc15" stroke-width="1" />

  <!-- Student 2 (Center) -->
  <circle cx="220" cy="177" r="7.5" fill="#fed7aa" />
  <rect x="211" y="188" width="18" height="27" rx="3" fill="#1e293b" />
  <rect x="214" y="194" width="12" height="15" rx="1" fill="#f8fafc" stroke="#facc15" stroke-width="1" />

  <!-- Student 3 -->
  <circle cx="270" cy="180" r="7" fill="#fed7aa" />
  <rect x="262" y="190" width="16" height="25" rx="3" fill="#047857" />
  <rect x="268" y="196" width="12" height="15" rx="1" fill="#f8fafc" stroke="#facc15" stroke-width="1" />

  <!-- Stage Lights Spot -->
  <ellipse cx="220" cy="225" rx="130" ry="12" fill="#fef08a" opacity="0.15" />
</svg>
