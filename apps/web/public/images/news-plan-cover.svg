<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="100%" height="100%">
  <defs>
    <linearGradient id="planBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background with subtle IT grid pattern -->
  <rect width="440" height="270" fill="url(#planBg)" />
  
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="45" x2="440" y2="45" />
    <line x1="0" y1="90" x2="440" y2="90" />
    <line x1="0" y1="135" x2="440" y2="135" />
    <line x1="0" y1="180" x2="440" y2="180" />
    <line x1="0" y1="225" x2="440" y2="225" />
    <line x1="88" y1="0" x2="88" y2="270" />
    <line x1="176" y1="0" x2="176" y2="270" />
    <line x1="264" y1="0" x2="264" y2="270" />
    <line x1="352" y1="0" x2="352" y2="270" />
  </g>

  <!-- Subtle glow orb -->
  <circle cx="380" cy="50" r="90" fill="#38bdf8" opacity="0.15" filter="blur(20px)" />
  <circle cx="50" cy="220" r="80" fill="#2563eb" opacity="0.2" filter="blur(20px)" />

  <!-- University Header Bar -->
  <rect x="25" y="20" width="390" height="32" rx="6" fill="#0f172a" opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="220" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.8">
    TRƯỜNG ĐẠI HỌC CÔNG THƯƠNG TP. HỒ CHÍ MINH (HUIT)
  </text>
  <text x="220" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">
    KHOA CÔNG NGHỆ THÔNG TIN
  </text>

  <!-- Central Announcement Document Frame -->
  <rect x="55" y="68" width="330" height="152" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Red Top Stripe on Card -->
  <path d="M55 78 C55 72.477 59.477 68 65 68 L375 68 C380.523 68 385 72.477 385 78 L385 82 L55 82 Z" fill="url(#redAccent)" />

  <!-- Document / Plan Icon Badge -->
  <g transform="translate(85, 102)">
    <!-- Document shadow -->
    <rect x="0" y="0" width="46" height="58" rx="4" fill="#e2e8f0" />
    <rect x="2" y="2" width="42" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Folded corner -->
    <path d="M32 2 L44 14 L32 14 Z" fill="#94a3b8" />
    <!-- Document lines -->
    <line x1="8" y1="18" x2="26" y2="18" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="26" x2="36" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="33" x2="36" y2="33" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="40" x2="30" y2="40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="47" x2="22" y2="47" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    
    <!-- Seal stamp -->
    <circle cx="34" cy="46" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1" />
    <text x="34" y="48.5" font-family="sans-serif" font-size="6" font-weight="bold" fill="#dc2626" text-anchor="middle">★</text>
  </g>

  <!-- Typography on Card -->
  <g transform="translate(148, 100)">
    <!-- Tag badge -->
    <rect x="0" y="0" width="138" height="18" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8" />
    <text x="69" y="12.5" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle" letter-spacing="0.5">
      THÔNG BÁO CHÍNH THỨC
    </text>

    <!-- Main Title -->
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">
      KẾ HOẠCH HỌC THUẬT
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0369a1">
      Khoa Công nghệ thông tin
    </text>

    <!-- Bullets -->
    <text x="0" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">
      • Hoạt động học thuật dành cho sinh viên
    </text>
    <text x="0" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">
      • Ban hành kế hoạch &amp; tệp quyết định kèm theo
    </text>
  </g>

  <!-- Bottom Bar with Year / Status -->
  <rect x="55" y="228" width="330" height="24" rx="6" fill="#0f172a" opacity="0.6" />
  <text x="70" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">
    NĂM HỌC 2024 - 2025
  </text>
  <text x="370" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="end">
    HUIT IT FACULTY
  </text>
</svg>
