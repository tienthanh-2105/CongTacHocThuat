<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="100%" height="100%">
  <defs>
    <linearGradient id="kseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="440" height="270" fill="url(#kseBg)" />

  <!-- Network / AI Nodes Graph in background -->
  <g stroke="#6366f1" stroke-width="0.8" opacity="0.35">
    <line x1="40" y1="60" x2="120" y2="110" />
    <line x1="120" y1="110" x2="220" y2="70" />
    <line x1="220" y1="70" x2="310" y2="120" />
    <line x1="310" y1="120" x2="390" y2="60" />
    <line x1="120" y1="110" x2="180" y2="180" />
    <line x1="220" y1="70" x2="260" y2="170" />
    <line x1="310" y1="120" x2="350" y2="190" />
    <line x1="180" y1="180" x2="260" y2="170" />
    <line x1="260" y1="170" x2="350" y2="190" />
  </g>
  <g fill="#a855f7" opacity="0.6">
    <circle cx="40" cy="60" r="3" />
    <circle cx="120" cy="110" r="4" />
    <circle cx="220" cy="70" r="4.5" />
    <circle cx="310" cy="120" r="4" />
    <circle cx="390" cy="60" r="3" />
    <circle cx="180" cy="180" r="3.5" />
    <circle cx="260" cy="170" r="4" />
    <circle cx="350" cy="190" r="3.5" />
  </g>

  <!-- Central Conference Card -->
  <rect x="35" y="30" width="370" height="155" rx="8" fill="#18181b" stroke="url(#purpleGold)" stroke-width="1.8" opacity="0.95" />
  
  <text x="220" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="url(#purpleGold)" text-anchor="middle" letter-spacing="2">
    CHÚC MỪNG GIẢNG VIÊN &amp; SINH VIÊN KHOA CNTT
  </text>
  <text x="220" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    CÔNG TRÌNH NGHIÊN CỨU XUẤT BẢN
  </text>
  <text x="220" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="url(#goldText)" text-anchor="middle">
    HỘI NGHỊ QUỐC TẾ IEEE KSE 2026
  </text>
  <text x="220" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#cbd5e1" text-anchor="middle">
    18TH INTERNATIONAL CONFERENCE ON KNOWLEDGE AND SYSTEMS ENGINEERING
  </text>
  <line x1="80" y1="148" x2="360" y2="148" stroke="#475569" stroke-width="0.8" />
  <text x="220" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#a78bfa" text-anchor="middle">
    NHÓM NGHIÊN CỨU AI &amp; DATA SCIENCE · KHOA CÔNG NGHỆ THÔNG TIN · HUIT
  </text>

  <!-- Bottom Paper Icon & Tag -->
  <g transform="translate(140, 205)">
    <rect x="0" y="0" width="160" height="34" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text x="80" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
      IEEE XPLORE DIGITAL LIBRARY
    </text>
  </g>
</svg>
