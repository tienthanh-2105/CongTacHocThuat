<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="100%" height="100%">
  <defs>
    <linearGradient id="hallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Hall -->
  <rect width="440" height="270" fill="url(#hallGrad)" />

  <!-- Stage Lights & Curtains -->
  <path d="M0 0 L90 0 L40 180 L0 220 Z" fill="#991b1b" opacity="0.4" />
  <path d="M440 0 L350 0 L400 180 L440 220 Z" fill="#991b1b" opacity="0.4" />
  <rect x="0" y="210" width="440" height="60" fill="#334155" />

  <!-- Main Backdrop Banner -->
  <rect x="40" y="25" width="360" height="150" rx="8" fill="url(#bannerGrad)" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Logo / Crest Badge -->
  <circle cx="220" cy="55" r="18" fill="#ffffff" />
  <path d="M213 55 L220 45 L227 55 L223 55 L223 63 L217 63 L217 55 Z" fill="#0284c7" />
  
  <!-- Banner Text -->
  <text x="220" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">
    BẾ MẠC HỘI NGHỊ KHOA HỌC FAIR 2026
  </text>
  <text x="220" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    FUNDAMENTAL AND APPLIED IT RESEARCH (FAIR XIX)
  </text>
  <text x="220" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#e0f2fe" text-anchor="middle">
    TRƯỜNG ĐẠI HỌC CÔNG THƯƠNG TP. HỒ CHÍ MINH (HUIT)
  </text>
  <line x1="120" y1="134" x2="320" y2="134" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="4,4" />
  <text x="220" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#bae6fd" text-anchor="middle">
    KHOA CÔNG NGHỆ THÔNG TIN · 08 - 09/10/2026
  </text>

  <!-- People on Stage / Audience -->
  <g fill="#f8fafc" opacity="0.95">
    <!-- Center group -->
    <circle cx="220" cy="192" r="7" fill="#fed7aa" />
    <path d="M211 202 C211 199 229 199 229 202 L227 225 L213 225 Z" fill="#1e293b" />

    <circle cx="202" cy="193" r="6.5" fill="#fed7aa" />
    <path d="M194 202 C194 200 210 200 210 202 L208 225 L196 225 Z" fill="#0369a1" />

    <circle cx="238" cy="193" r="6.5" fill="#fcd34d" />
    <path d="M230 202 C230 200 246 200 246 202 L244 225 L232 225 Z" fill="#047857" />

    <circle cx="185" cy="195" r="6" fill="#fed7aa" />
    <path d="M178 203 C178 201 192 201 192 203 L191 225 L179 225 Z" fill="#b91c1c" />

    <circle cx="255" cy="195" r="6" fill="#fed7aa" />
    <path d="M248 203 C248 201 262 201 262 203 L261 225 L249 225 Z" fill="#374151" />

    <circle cx="168" cy="196" r="6" fill="#fed7aa" />
    <path d="M162 204 L174 204 L173 225 L163 225 Z" fill="#1e3a8a" />

    <circle cx="272" cy="196" r="6" fill="#fed7aa" />
    <path d="M266 204 L278 204 L277 225 L267 225 Z" fill="#4338ca" />
  </g>

  <!-- Audience Silhouettes Foreground -->
  <g fill="#0b1329" opacity="0.9">
    <ellipse cx="60" cy="265" rx="35" ry="25" />
    <circle cx="60" cy="235" r="11" />

    <ellipse cx="140" cy="265" rx="35" ry="25" />
    <circle cx="140" cy="232" r="11" />

    <ellipse cx="220" cy="268" rx="40" ry="25" />
    <circle cx="220" cy="234" r="11" />

    <ellipse cx="300" cy="265" rx="35" ry="25" />
    <circle cx="300" cy="232" r="11" />

    <ellipse cx="380" cy="265" rx="35" ry="25" />
    <circle cx="380" cy="235" r="11" />
  </g>
</svg>
